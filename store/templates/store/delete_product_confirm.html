<style>
body {
    font-family: 'Inter', sans-serif;
    background: #f4f8ff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Container box */
.delete-container {
    background: #ffffff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(31, 60, 136, 0.15);
    width: 420px;
    text-align: center;
    border: 1px solid #e6efff;
}

/* Title */
.delete-container h2 {
    color: #1f3c88;
    font-size: 20px;
    margin-bottom: 10px;
}

/* Warning text */
.delete-container p {
    color: #555;
    font-size: 14px;
    margin-bottom: 20px;
}

/* Buttons container */
.delete-container form {
    display: flex;
    justify-content: center;
    gap: 10px;
}

/* DELETE button */
.delete-btn {
    background: linear-gradient(90deg, #c0392b, #e74c3c);
    color: white;
    border: none;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.2s ease;
}

.delete-btn:hover {
    transform: translateY(-2px);
    background: linear-gradient(90deg, #a93226, #c0392b);
}

/* CANCEL button */
.cancel-btn {
    background: #eef3ff;
    color: #1f3c88;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 8px;
    text-decoration: none;
    display: inline-block;
    transition: 0.2s ease;
}

.cancel-btn:hover {
    background: #dce8ff;
    transform: translateY(-2px);
}
</style>

<div class="delete-container">
    <h2>Delete Product: {{ product.name }}</h2>
    <p>Are you sure you want to delete this product? This cannot be undone.</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="delete-btn">Yes, Delete</button>
        <a href="{% url 'staff_dashboard' %}" class="cancel-btn">Cancel</a>
    </form>
</div>
