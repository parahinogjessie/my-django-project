{% extends 'store/base.html' %}

{% block title %}Contact Us{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 50px auto; padding: 30px; background: #fff; border-radius: 20px; box-shadow: 0 6px 20px rgba(0,0,0,0.1); font-family: Arial, sans-serif;">

    <h2 style="text-align: center; margin-bottom: 10px;">Contact Us</h2>
    <p style="text-align:center; color:#666; margin-bottom:25px;">
        Have questions or need help? Send us your details below.
    </p>

    <form method="POST" style="display: flex; flex-direction: column; gap: 20px;">
        {% csrf_token %}

        <!-- Full Name -->
        <div style="display: flex; flex-direction: column;">
            <label for="full_name" style="font-weight:600; margin-bottom:5px;">Full Name</label>
            <input type="text" name="full_name" id="full_name" placeholder="John Doe" 
                   value="{{ profile.full_name|default:'' }}" required
                   style="padding:10px; border:1px solid #ccc; border-radius:8px;">
        </div>

        <!-- Email -->
        <div style="display: flex; flex-direction: column;">
            <label for="email" style="font-weight:600; margin-bottom:5px;">Email</label>
            <input type="email" name="email" id="email" placeholder="example@gmail.com" 
                   value="{{ user.email|default:'' }}" required
                   style="padding:10px; border:1px solid #ccc; border-radius:8px;">
        </div>

        <!-- Mobile Number -->
        <div style="display: flex; flex-direction: column;">
            <label for="mobile" style="font-weight:600; margin-bottom:5px;">Mobile Number</label>
            <input type="text" name="mobile" id="mobile" placeholder="09123456789" 
                   value="{{ profile.mobile|default:'' }}" required
                   style="padding:10px; border:1px solid #ccc; border-radius:8px;">
        </div>

        <!-- Address -->
        <div style="display: flex; flex-direction: column;">
            <label for="address" style="font-weight:600; margin-bottom:5px;">Address</label>
            <textarea name="address" id="address" placeholder="Enter your full address" required
                      style="padding:10px; border:1px solid #ccc; border-radius:8px; resize:vertical;">{{ profile.address|default:'' }}</textarea>
        </div>

        <!-- Message -->
        <div style="display: flex; flex-direction: column;">
            <label for="message" style="font-weight:600; margin-bottom:5px;">Message</label>
            <textarea name="message" id="message" placeholder="Write your message here..." required
                      style="padding:10px; border:1px solid #ccc; border-radius:8px; resize:vertical;"></textarea>
        </div>

        <!-- Submit Button -->
        <button type="submit" 
                style="padding:15px; background:#FE2C55; color:white; border:none; border-radius:12px; font-weight:700; font-size:1rem; cursor:pointer; transition:0.3s;">
            Send Message
        </button>

    </form>

</div>
{% endblock %}
