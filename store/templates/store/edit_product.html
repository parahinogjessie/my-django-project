{% load static %}

<style>
body {
    background: #f4f8ff;
    font-family: 'Inter', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* Card container */
.edit-container {
    position: relative;
    background: #ffffff;
    width: 450px;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(31, 60, 136, 0.15);
    border: 1px solid #e6efff;
}

/* Title */
.edit-container h2 {
    color: #1f3c88;
    font-size: 20px;
    margin-bottom: 20px;
    text-align: center;
}

/* Django form styling */
.edit-container form p {
    margin-bottom: 12px;
}

.edit-container input,
.edit-container textarea,
.edit-container select {
    width: 100%;
    padding: 10px;
    border: 1px solid #d6e4ff;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    transition: 0.2s;
}

.edit-container input:focus,
.edit-container textarea:focus,
.edit-container select:focus {
    border-color: #1f3c88;
    box-shadow: 0 0 5px rgba(31, 60, 136, 0.2);
}

/* Save button */
.save-btn {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: linear-gradient(90deg, #1f3c88, #2f6fd6);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s ease;
}

.save-btn:hover {
    transform: translateY(-2px);
    background: linear-gradient(90deg, #16306f, #245ac2);
}
.back-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    padding: 8px 12px;
    background: #e0e7ff;
    color: #1e4ed8;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
    transition: 0.3s;
}

.back-btn:hover {
    background: #c7d2fe;
}
</style>

<div class="edit-container">

    <a href="{% url 'staff_dashboard' %}" class="back-btn">← Back</a>

    <h2>Edit Product: {{ product.name }}</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="save-btn">Save Changes</button>
    </form>

</div>
